# Production deployment for agent-service as an internal stateful Compose
# service (see docs/deployment.md).
#
# Differences from docker-compose.yml (dev):
#  - no bundled Postgres: agent-service connects to the shared Postgres
#    instance via DATABASE_URL
#  - all runtime configuration comes from an env file (default: .env),
#    which is host-managed and never committed
#  - the optional ./config directory is bind-mounted read-only for
#    host-managed config such as an AGENT_CATALOG_PATH JSON file
#
# Usage (from the host checkout, see deploy/bin/deploy.sh):
#   docker compose -p agent-service -f docker-compose.prod.yml --env-file .env up -d --build
services:
  agent-service:
    build: .
    image: agent-service:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${AGENT_SERVICE_HOST:-127.0.0.1}:${AGENT_SERVICE_PORT:-8080}:8080"
    volumes:
      - ./config:/etc/agent-service:ro
